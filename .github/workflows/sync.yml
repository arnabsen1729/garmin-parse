name: Sync Garmin activities

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies
        run: uv sync --locked

      - name: Restore cached Garmin session
        run: |
          mkdir -p ~/.garminconnect
          cat > ~/.garminconnect/garmin_tokens.json <<'EOF'
          ${{ secrets.GARMIN_TOKENSTORE }}
          EOF

      - name: Run sync
        id: sync
        continue-on-error: true
        run: uv run garmin-parse sync

      - name: Commit and push new activities
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add activities/
          if git diff --cached --quiet; then
            echo "No new activities to commit."
          else
            git commit -m "chore: sync Garmin activities"
            git push
          fi

      - name: Refresh GARMIN_TOKENSTORE secret
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          if [ -f ~/.garminconnect/garmin_tokens.json ]; then
            gh secret set GARMIN_TOKENSTORE --repo "$GITHUB_REPOSITORY" < ~/.garminconnect/garmin_tokens.json
          else
            echo "No token file found; skipping secret refresh."
          fi

      - name: Fail job if sync step failed
        if: steps.sync.outcome == 'failure'
        run: |
          echo "Sync step failed; marking job as failed."
          exit 1
