<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>garmin-parse activities — Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="app-header">
    <a class="brand" href="#/">
      <span class="brand-mark">LEDGER</span>
      <span class="brand-sub">garmin-parse activities</span>
    </a>
    <div class="header-actions">
      <a class="repo-link" href="https://github.com/arnabsen1729/garmin-parse" target="_blank" rel="noopener">Repo ↗</a>
      <button id="theme-toggle" type="button" aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <div id="layout">
    <section id="list-pane" aria-label="Activity list">
      <div id="list-status" class="muted">Loading activities…</div>
      <div id="list-groups"></div>
    </section>

    <section id="detail-pane" aria-label="Activity detail">
      <div id="detail-empty" class="muted">Select an activity to view its details.</div>
      <div id="detail-content" hidden>
        <a href="#/" class="back-link">← Back to list</a>
        <div id="detail-hero"></div>
        <div id="detail-stats" class="stat-grid"></div>
        <div id="detail-hr"></div>
        <div id="detail-te"></div>
        <div id="detail-dynamics"></div>
        <div id="detail-spacer"></div>
      </div>
      <div id="detail-error" class="muted" hidden></div>
      <div id="detail-loading" class="muted" hidden>Loading…</div>
    </section>
  </div>

  <div id="action-bar" hidden>
    <button id="copy-btn" type="button">Copy raw Markdown</button>
    <a id="source-link" href="#" target="_blank" rel="noopener" title="View source on GitHub">Source ↗</a>
  </div>

  <div id="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
