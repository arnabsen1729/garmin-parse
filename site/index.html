<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>garmin-parse activities — Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet" />
<!-- Bump ?v= whenever styles.css/app.js change. No build step means no
     content-hashed filenames, and hosts (browsers, CDNs) can otherwise
     cache these indefinitely across a hash-router navigation that never
     reloads the page. -->
<link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>
  <div id="layout">
    <section id="list-pane" aria-label="Activity list">
      <div id="list-header">
        <div>
          <div class="list-kicker">garmin-parse</div>
          <h1 class="list-title">Activities</h1>
        </div>
        <div class="header-actions">
          <button id="search-toggle" class="icon-btn" type="button" aria-label="Search activities">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg>
          </button>
          <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
          </button>
        </div>
      </div>
      <div id="search-bar" hidden>
        <input id="search-input" type="text" placeholder="Search activities…" autocomplete="off" />
      </div>
      <div id="list-status" class="muted">Loading activities…</div>
      <div id="list-groups"></div>
    </section>

    <section id="detail-pane" aria-label="Activity detail">
      <div id="detail-empty" class="muted">Select an activity to view its details.</div>
      <div id="detail-content" hidden>
        <a href="#/" class="back-link">← Back to list</a>
        <div id="detail-top">
          <div id="detail-hero"></div>
          <div id="detail-actions-top" class="action-buttons"></div>
        </div>
        <div id="detail-stats" class="stat-grid"></div>
        <div id="detail-hr"></div>
        <div id="detail-te"></div>
        <div id="detail-dynamics"></div>
        <div id="detail-spacer"></div>
      </div>
      <div id="detail-error" class="muted" hidden></div>
      <div id="detail-loading" class="muted" hidden>Loading…</div>
    </section>
  </div>

  <div id="action-bar" class="action-buttons" hidden></div>

  <div id="toast" role="status" hidden></div>

  <script src="app.js?v=3"></script>
</body>
</html>
