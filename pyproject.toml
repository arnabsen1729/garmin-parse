[project]
name = "garmin-parse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arnab Sen", email = "arnabsen1729@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fitdecode>=0.11,<1",
    "garminconnect>=0.3.11",
    "mcp>=1.30,<2",
    "pydantic>=2.12,<3",
    "pyjwt[crypto]>=2.10,<3",
    "typer>=0.27.1",
]

[project.scripts]
garmin-parse = "garmin_parse.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
